<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mert Savaş — uygulama siteleri, gizlilik ve destek." />
    <title>Mert Savaş — Uygulamalar</title>
    <meta name="theme-color" content="#07111f" />
    <style>
      :root {
        --bg: #07111f;
        --card: #171d2b;
        --text: #f8fafc;
        --muted: rgba(248, 250, 252, 0.58);
        --cyan: #22d3ee;
        --yellow: #ffd60a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
        padding: 2.5rem 1.25rem 3rem;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 1.75rem; font-weight: 900; margin: 0 0 0.35rem; }
      .lead { color: var(--muted); margin: 0 0 1.75rem; }
      .card {
        display: block;
        background: var(--card);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 1.15rem 1.25rem;
        margin-bottom: 0.85rem;
        color: inherit;
        text-decoration: none;
      }
      .card:hover { border-color: rgba(34,211,238,0.35); }
      .card strong { display: block; font-size: 1.1rem; margin-bottom: 0.25rem; }
      .card span { color: var(--muted); font-size: 0.92rem; }
      .meta { margin-top: 1.75rem; font-size: 0.85rem; color: var(--muted); }
      a.inline { color: var(--cyan); }
    </style>
  </head>
  <body>
    <main>
      <h1>Mert Savaş</h1>
      <p class="lead">Uygulama siteleri · gizlilik · destek · AdMob app-ads.txt</p>

      <a class="card" href="https://mertsavas97-spec.github.io/kelime-avi/">
        <strong>Kelime Avı</strong>
        <span>Türkçe harf bulmacası — pazarlama, gizlilik, destek</span>
      </a>

      <a class="card" href="https://mertsavas97-spec.github.io/taksitdefter.app/">
        <strong>TaksitDefter</strong>
        <span>Taksit ve abonelik takibi — pazarlama, gizlilik, destek</span>
      </a>

      <p class="meta">
        AdMob <code>app-ads.txt</code>:
        <a class="inline" href="./app-ads.txt">/app-ads.txt</a>
      </p>
    </main>
  </body>
</html>
